<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ sign up</title>
    <link rel="icon" href="images/logo_outline_svg.svg" />
    <link rel="stylesheet" href="css/auth.css" />
    <script type="module" src="js/auth.js" defer></script>
  </head>
  <body>
    <header>
      <h2>Welcome to AZ&mdash; Sales Tracker !</h2>
    </header>
    <main>
      <div class="container">
        <section class="logo_section">
          <figure>
            <img src="images/logo_outline_svg.svg" alt="Logo image" />
            <figcaption>
              Sign in to continue
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="30"
                height="30"
                viewBox="0 0 24 24"
              >
                <path
                  fill="none"
                  stroke="#e6a52d"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m10 17l5-5l-5-5"
                />
              </svg>
            </figcaption>
          </figure>
        </section>

        <section class="form_section">
          <form id="signingForm">
            <h2 id="header">Sign In</h2>

            <div class="input_label_div name-container">
              <label for="name">Business Name</label>
              <input
                type="text"
                placeholder="type your Business name..."
                id="name"
                required
              />
            </div>

            <div class="input_label_div">
              <label for="email">Email</label>
              <input
                type="email"
                placeholder="type your Email..."
                id="email"
                required
              />
            </div>

            <div class="input_label_div">
              <label for="password">Password</label>
              <input
                type="password"
                placeholder="type your Password..."
                id="password"
                required
              />
            </div>

            <button type="submit">Let's Go</button>

            <p
              onclick="window.location.href = 'recover.html'"
              style="cursor: pointer"
            >
              Forgot Password?
            </p>

            <p id="switchOption" class="switch_signing">Sign Up</p>
          </form>
        </section>
      </div>
    </main>

    <div id="notifContainer" class="notif_container">
      <div id="svgContainer" class="svg_container">
        <svg
          class="failed-icon"
          height="25"
          width="25"
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M26.41 25L30 21.41L28.59 20L25 23.59L21.41 20L20 21.41L23.59 25L20 28.59L21.41 30L25 26.41L28.59 30L30 28.59L26.41 25zM18 2A12.035 12.035 0 0 0 6 14v6.2l-3.6-3.6L1 18l6 6l6-6l-1.4-1.4L8 20.2V14a10 10 0 0 1 20 0v3h2v-3A12.035 12.035 0 0 0 18 2z"
            fill="currentColor"
          />
        </svg>

        <svg
          class="success-icon"
          height="20"
          width="20"
          viewBox="0 0 1024 1024"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="m576 736l-32-.001v-286c0-.336-.096-.656-.096-1.008s.096-.655.096-.991c0-17.664-14.336-32-32-32h-64c-17.664 0-32 14.336-32 32s14.336 32 32 32h32v256h-32c-17.664 0-32 14.336-32 32s14.336 32 32 32h128c17.664 0 32-14.336 32-32s-14.336-32-32-32zm-64-384.001c35.344 0 64-28.656 64-64s-28.656-64-64-64s-64 28.656-64 64s28.656 64 64 64zm0-352c-282.768 0-512 229.232-512 512c0 282.784 229.232 512 512 512c282.784 0 512-229.216 512-512c0-282.768-229.216-512-512-512zm0 961.008c-247.024 0-448-201.984-448-449.01c0-247.024 200.976-448 448-448s448 200.977 448 448s-200.976 449.01-448 449.01z"
            fill="currentColor"
          />
        </svg>
      </div>

      <p id="notifText" class="notif_text"></p>

      <div id="progress_bar" class="progress"></div>
    </div>
  </body>
</html>
