<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ sign up</title>
    <link rel="icon" href="images/logo_outline_svg.svg" />
    <link rel="stylesheet" href="css/auth.css" />
    <script type="module" src="js/auth.js" defer></script>
  </head>
  <body>
    <header>
      <h2>Welcome to AZ&mdash; Sales Tracker !</h2>
    </header>
    <main>
      <div class="container">
        <section class="logo_section">
          <figure>
            <img src="images/logo_outline_svg.svg" alt="Logo image" />
            <figcaption>
              Sign in to continue
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="30"
                height="30"
                viewBox="0 0 24 24"
              >
                <path
                  fill="none"
                  stroke="#e6a52d"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m10 17l5-5l-5-5"
                />
              </svg>
            </figcaption>
          </figure>
        </section>

        <section class="form_section">
          <form id="signingForm">
            <h2 id="header">Sign In</h2>

            <div class="input_label_div name-container">
              <label for="name">Business Name</label>
              <input
                class="form-input"
                type="text"
                placeholder="type your Business name..."
                id="name"
              />
            </div>

            <div class="input_label_div">
              <label for="email">Email</label>
              <input
                class="form-input"
                type="email"
                placeholder="type your Email..."
                id="email"
                required
              />
            </div>

            <div class="input_label_div">
              <label for="password">Password</label>
              <input
                class="form-input"
                type="password"
                placeholder="type your Password..."
                id="password"
                required
              />
            </div>

            <div id="form-feedback-container" class="form-feedback-container">
              <p id="form-feedback-text">
                Please check your email for a verification link.
              </p>
            </div>

            <button type="submit">Let's Go</button>

            <p
              onclick="window.location.href = 'recover.html'"
              style="cursor: pointer"
            >
              Forgot Password?
            </p>

            <p id="switchOption" class="switch_signing">Sign Up</p>
          </form>
        </section>
      </div>
    </main>

    <div id="notifContainer" class="notif_container">
      <div id="svgContainer" class="svg_container">
        <svg
          style="display: none"
          id="failed-icon"
          class="failed-icon"
          height="25"
          width="25"
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M26.41 25L30 21.41L28.59 20L25 23.59L21.41 20L20 21.41L23.59 25L20 28.59L21.41 30L25 26.41L28.59 30L30 28.59L26.41 25zM18 2A12.035 12.035 0 0 0 6 14v6.2l-3.6-3.6L1 18l6 6l6-6l-1.4-1.4L8 20.2V14a10 10 0 0 1 20 0v3h2v-3A12.035 12.035 0 0 0 18 2z"
            fill="currentColor"
          />
        </svg>

        <svg
          style="display: none"
          id="success-icon"
          class="success-icon"
          height="25"
          width="25"
          viewBox="0 0 512 512"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M256 42.667C138.18 42.667 42.667 138.18 42.667 256S138.18 469.334 256 469.334S469.334 373.82 469.334 256S373.821 42.667 256 42.667m0 384c-94.105 0-170.666-76.561-170.666-170.667S161.894 85.334 256 85.334S426.667 161.894 426.667 256S350.106 426.667 256 426.667m80.336-246.886l30.167 30.167l-131.836 132.388l-79.083-79.083l30.166-30.167l48.917 48.917z"
            fill="currentColor"
            fillRule="evenodd"
          />
        </svg>
      </div>

      <p id="notifText" class="notif_text"></p>

      <div id="progress_bar" class="progress"></div>
    </div>
  </body>
</html>
